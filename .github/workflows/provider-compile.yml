name: Provider compile check

# 임시 검증용: 최소 Expo 앱에 modules/assistant-share 를 넣고 Kotlin 이 컴파일되는지만 확인한다.
# 앱 본체(feat/app)가 합쳐지면 build-apk.yml 이 같은 일을 하므로 이 파일은 지워도 된다.
on:
  workflow_dispatch:
  push:
    branches: [feat/assistant-provider]
    paths: ['modules/**', '.github/workflows/provider-compile.yml']

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Python reference tests
        run: python3 -m unittest tests.provider.test_provider tests.provider.test_parity

      - name: Scaffold minimal Expo app (SDK 58)
        run: |
          npx --yes create-expo-app@latest scratch --template blank-typescript@sdk-58 --no-install
          cd scratch
          cat package.json | head -30
          npm install --no-audit --no-fund
          mkdir -p modules
          cp -r ../modules/assistant-share modules/assistant-share
          node -e "const f='app.json',j=require('./app.json');j.expo.android={...(j.expo.android||{}),package:'com.hwetj.routinelog'};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"

      - name: Prebuild
        working-directory: scratch
        run: npx expo prebuild --platform android --no-install

      - name: Compile Kotlin of assistant-share
        working-directory: scratch/android
        run: ./gradlew :assistant-share:compileReleaseKotlin --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Merged manifest has the provider
        working-directory: scratch/android
        run: |
          ./gradlew :app:processReleaseManifest --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"
          grep -rn "com.hwetj.routinelog.assistant" app/build/intermediates/merged_manifest/release/ | head
